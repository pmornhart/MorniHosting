# ─────────────────────────────────────────────────────────────────────────────
#  MorniCraft – Einstellungen
#  Nach einer Änderung: /mornicraft reload (oder Server neu starten).
#  Läuft der Server über MorniHosting, schreibt das Panel diese Datei selbst
#  (Dashboard → Server → Einstellungen → MorniCraft) – dann dort ändern.
# ─────────────────────────────────────────────────────────────────────────────

# Sprache der Texte im Spiel: de oder en
language: de
# Name oben in der Leiste rechts und im Begrüßungs-Titel
server-name: MorniCraft
# Zeitzone für die Uhrzeit in der Leiste
timezone: Europe/Berlin
# Link zu einer Befehls-Seite pro Spieler ({name} = Spielername). Leer = kein Link.
link: ''

# Sekunden stillstehen vor /spawn, /home, /tpa, /back (Admins sofort). 0 = sofort.
teleport-delay: 5
# Wie viele Zuhause jeder mit /sethome speichern darf (Admins unbegrenzt)
max-homes: 5
# /spawn und /home (mit /sethome, /homes, /delhome) ein- oder ausschalten
spawn-command: true
homes: true
# Begrenzungen: wie oft ein Befehl in einer Zeit benutzt werden darf (uses: 0 = unbegrenzt, hours = Zeitraum).
# Beispiel: einmal pro Stunde = uses: 1, hours: 1 · dreimal am Tag = uses: 3, hours: 24. Admins und OPs sind frei.
limits:
  spawn: { uses: 0, hours: 24 }
  home: { uses: 0, hours: 24 }
  tpa: { uses: 0, hours: 24 }
  back: { uses: 0, hours: 24 }
# Clans: /clan (Menü), Clan-Basis, Clan-Chat /cc, Kürzel im Chat, kein Schaden unter Clan-Mitgliedern
clans:
  enabled: true
  max-members: 10
tpa: true
back: true

# Rund um den Spawn-Punkt der Welt: nur Admins bauen oder abbauen.
spawn-protection: true
spawn-radius: 55
# Am Spawn schlafen (und dort einen Respawn-Punkt setzen)?
sleep-at-spawn: false
# Am Spawn kämpfen?
pvp-at-spawn: false

# Start-Elytra: am Spawn 2× Leertaste = losgleiten, kein Fallschaden, F (Bedrock: Schleichen) = ein Schub
elytra: true
elytra-radius: 45
elytra-boost: true

# Für die ganze Welt
tnt: true
creeper-damage: true
fire-spread: true
enderman-grief: true

# Große Begrüßung – einmal pro Spieler
welcome: true
# Leiste rechts mit Uhrzeit, Spielzeit, Online, Ping, Befehlen (jeder kann sie mit /leiste ausblenden)
sidebar: true
# Auf GitHub nach neuen Versionen schauen und Admins Bescheid geben
update-check: true

# Regeln für /rules – eine pro Zeile
rules:
  - Sei nett zu allen.
  - Nichts kaputt machen, was anderen gehört.
  - Keine Cheats, keine Hacks.
  - Viel Spaß!

# Befehlsliste für /info. Leer = die eingebaute Liste.
groups: []

# Weitere geschützte Stellen außerhalb des Spawn-Kreises (z. B. kleine Inseln): x/z vom Welt-Spawn aus, r = Radius
zones: []

# Ränge: Symbol und Farbe vor dem Namen (Chat, Tab-Liste, über dem Kopf) und die Rechte dazu.
# Der oberste passende gilt. players: Minecraft-Namen (oder UUIDs). default: true = alle anderen.
# Rechte: mornicraft.build (Spawn bauen), mornicraft.instant (ohne Wartezeit), mornicraft.unlimitedhomes,
# mornicraft.admin (/mornicraft reload), mornicraft.ranks (Ränge vergeben: /vip <spieler>) und Minecraft-Befehle wie minecraft.command.kick.
ranks:
  - {
      id: owner,
      name: Owner,
      symbol: '♛',
      color: '#ff5555',
      players: [],
      permissions:
        [
          mornicraft.build,
          mornicraft.instant,
          mornicraft.unlimitedhomes,
          mornicraft.admin,
          mornicraft.ranks,
          mornicraft.moderate,
          mornicraft.creative,
          minecraft.command.kick,
          minecraft.command.ban,
          minecraft.command.pardon,
          minecraft.command.gamemode,
          minecraft.command.teleport,
          minecraft.command.tp,
          minecraft.command.time,
          minecraft.command.weather,
          minecraft.command.whitelist,
        ],
    }
  - {
      id: moderator,
      name: Moderator,
      symbol: '⚔',
      color: '#55aaff',
      players: [],
      permissions:
        [
          mornicraft.instant,
          mornicraft.moderate,
          minecraft.command.kick,
          minecraft.command.ban,
          minecraft.command.pardon,
          minecraft.command.teleport,
          minecraft.command.tp,
          minecraft.command.gamemode,
        ],
    }
  - {
      id: media,
      name: Media,
      symbol: '▶',
      color: '#ff6ad5',
      players: [],
      permissions: [mornicraft.unlimitedhomes],
    }
  - {
      id: vip,
      name: VIP,
      symbol: '★',
      color: '#ffd23f',
      players: [],
      permissions: [mornicraft.unlimitedhomes],
    }
  - { id: player, name: Spieler, symbol: '', color: '#aaaaaa', players: [], permissions: [], default: true }

# Rang-Abzeichen im Chat: Texturpaket (url + sha1) und pro Rang `badge: "<Zeichen>"`. Leer = Symbole.
pack: { url: '', sha1: '', required: true }

# Gräber: wer stirbt, bekommt ein Grab mit allen Sachen und der Erfahrung (Rechtsklick öffnet es wie eine Truhe).
# Auf Treppen und Stufen setzen: Rechtsklick mit leerer Hand, Schleichen = aufstehen
sit: true
graves: true
# So viele Minuten darf nur der Tote (und das Team) das Grab öffnen, danach alle.
grave-private-minutes: 15
# Kills und Tode neben jedem Namen in der Tab-Liste.
tab-stats: true
# Streamer-Modus: Namen und Adressen dieses Servers, die zu ••• werden (MorniHosting trägt sie selbst ein).
streamer:
  hide: []
# Kampf-System: so viele Sekunden ist man nach einem Treffer zwischen Spielern "im Kampf" (kein Teleport,
# keine Befehle außer Chat, Ausloggen = Tod). 0 = aus.
combat-seconds: 15
