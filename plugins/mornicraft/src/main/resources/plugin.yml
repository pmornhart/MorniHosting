name: MorniCraft
version: '${project.version}'
main: de.mornihosting.mornicraft.MorniCraft
api-version: '1.17'
softdepend: [floodgate]
description: Spawn, Zuhause, Teleports, Nachrichten und Start-Elytra für MorniCraft-Server (MorniHosting).
author: MorniHosting
website: https://github.com/pmornhart/MorniCraft
commands:
  spawn: { description: Zurück zum Spawn }
  sethome: { description: Merkt sich diesen Ort als Zuhause, usage: '/sethome [name]' }
  home: { description: Deine Zuhause (Betten) – oder direkt hin mit Namen, usage: '/home [name]' }
  homes: { description: Deine Zuhause als Betten }
  delhome: { description: Löscht ein Zuhause, usage: '/delhome <name>' }
  back: { description: Zurück zum letzten Ort }
  tpa: { description: Fragt, ob du zu jemandem darfst, usage: '/tpa <spieler>' }
  tpahere: { description: Fragt, ob jemand zu dir kommt, usage: '/tpahere <spieler>' }
  tpaccept: { description: Anfrage annehmen, aliases: [tpyes] }
  tpdeny: { description: Anfrage ablehnen, aliases: [tpno] }
  msg: { description: Private Nachricht, usage: '/msg <spieler> <text>', aliases: [tell, w, whisper] }
  r: { description: Auf die letzte Nachricht antworten, usage: '/r <text>', aliases: [reply] }
  mail: { description: Nachrichten für später, usage: '/mail send <spieler> <text> | /mail read' }
  ignore: { description: Jemanden ausblenden, usage: '/ignore <spieler>' }
  afk: { description: Zeigt, dass du kurz weg bist }
  seen: { description: Wann jemand zuletzt da war, usage: '/seen <spieler>' }
  near: { description: Wer in deiner Nähe ist }
  getpos: { description: Deine Koordinaten, aliases: [coords] }
  ping: { description: Deine Verbindung zum Server }
  info: { description: Alle Befehle, aliases: [befehle, commands] }
  rules: { description: Die Regeln, aliases: [regeln] }
  leiste: { description: Leiste rechts ein- oder ausblenden, aliases: [sidebar] }
  streamer:
    {
      description: 'Streamer-Modus: IPs, Koordinaten und Nachrichten verstecken',
      usage: '/streamer [an|aus]',
      aliases: [streamermodus, streamermode, streamer-modus, stream],
    }
  abzeichen:
    { description: Rang-Abzeichen neu laden und zeigen, was dein Spiel meldet, aliases: [badges, pack] }
  gefaengnis:
    {
      description: Jemanden ins Gefängnis stecken (Team),
      usage: '/gefaengnis <spieler> [10m|1h|1d] [grund]',
      aliases: [gefängnis, jail, knast],
      permission: mornicraft.moderate,
    }
  frei:
    {
      description: Aus dem Gefängnis holen (Team),
      usage: '/frei <spieler>',
      aliases: [unjail, freilassen],
      permission: mornicraft.moderate,
    }
  stumm:
    {
      description: Jemanden stummschalten (Team),
      usage: '/stumm <spieler> [10m|1h|1d] [grund]',
      aliases: [mute],
      permission: mornicraft.moderate,
    }
  entstummen:
    {
      description: Stummschaltung aufheben (Team),
      usage: '/entstummen <spieler>',
      aliases: [unmute],
      permission: mornicraft.moderate,
    }
  einfrieren:
    {
      description: Jemanden einfrieren oder auftauen (Team),
      usage: '/einfrieren <spieler>',
      aliases: [freeze],
      permission: mornicraft.moderate,
    }
  ansehen:
    {
      description: Team-Menü für einen Spieler (auch Ducken + Rechtsklick),
      usage: '/ansehen <spieler>',
      aliases: [inspect, moderation],
      permission: mornicraft.moderate,
    }
  clan:
    description: Clan-Menü und Clan-Befehle
    aliases: [clans]
  cc:
    description: Im Clan-Chat schreiben
    aliases: [clanchat]
  teamdashboard:
    {
      description: 'Team-Dashboard im Browser (ab Supporter): wer online ist, Gefängnis, Stumm …',
      aliases: [teamboard, dashboard],
    }
  team: { description: Wer im Team ist (Ränge), aliases: [staff, ränge, raenge] }
  rang:
    {
      description: 'Rang vergeben (Owner/Admin): /rang <spieler> <rang> [weg] – auch kurz /vip <spieler>',
      usage: '/rang <spieler> <rang> [weg]',
      aliases: [rank],
    }
  mornicraft:
    { description: Einstellungen neu laden, permission: mornicraft.admin, usage: '/mornicraft reload' }
permissions:
  mornicraft.moderate:
    description: Team-Werkzeuge (Gefängnis, Stumm, Einfrieren, Spieler-Menü).
    default: op
  mornicraft.ranks:
    description: Darf Ränge vergeben (/vip <spieler>, /rang <spieler> <rang>).
    default: op
  mornicraft.admin:
    description: Darf die Einstellungen neu laden.
    default: op
  mornicraft.instant:
    description: Teleportiert ohne Wartezeit.
    default: op
  mornicraft.build:
    description: Darf den Spawn verändern.
    default: op
  mornicraft.unlimitedhomes:
    description: Beliebig viele Zuhause.
    default: op
